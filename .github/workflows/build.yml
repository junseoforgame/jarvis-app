name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks \
            -storepass jarvis1234 -keypass jarvis1234 \
            -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Jarvis, OU=Personal, O=Personal, L=Seoul, ST=Seoul, C=KR"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
